<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">dsh-opencli — your logged-in browser for DeepSeek Harness</title>
<desc id="desc">Left: DeepSeek Harness agent, middle: your real browser with login, right: 170+ site adapters as structured commands</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0B0F1A"/>
    <stop offset="100%" stop-color="#162033"/>
  </linearGradient>
  <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
    <stop offset="100%" stop-color="#F1F4F9" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7C6CFF"/>
    <stop offset="100%" stop-color="#3ABFF8"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0B0F1A" flood-opacity="0.35"/>
  </filter>
  <linearGradient id="browserBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#E9ECF5"/>
    <stop offset="100%" stop-color="#DDE3F0"/>
  </linearGradient>
</defs>

<!-- background -->
<rect width="960" height="340" rx="24" fill="url(#bg)"/>
<!-- subtle grid -->
<g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
  <path d="M 0 80 H 960 M 0 170 H 960 M 0 260 H 960"/>
  <path d="M 240 0 V 340 M 480 0 V 340 M 720 0 V 340"/>
</g>

<!-- top label -->
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <text x="36" y="44" font-size="11" letter-spacing="3.2" fill="#8EA0C8" font-weight="600">DSH-OPENCLI</text>
  <text x="36" y="74" font-size="28" fill="#FFFFFF" font-weight="700" letter-spacing="-0.6">用你已登录的浏览器办事</text>
  <text x="36" y="100" font-size="13.5" fill="#A8B7D6" font-weight="400">logged-in browser + 170+ site adapters · write needs your approval</text>
</g>

<!-- arrow 1 -->
<g opacity="0.9">
  <path d="M 210 202 H 250" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C6CFF"/></marker></defs>
<!-- arrow 2 -->
<path d="M 610 202 H 650" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.9"/>

<!-- Card: DSH Agent -->
<g filter="url(#shadow)">
  <rect x="28" y="132" width="182" height="156" rx="16" fill="url(#cardBg)" stroke="#FFFFFF" stroke-opacity="0.9"/>
  <g font-family="Inter, -apple-system, sans-serif">
    <text x="52" y="164" font-size="11" letter-spacing="1.6" fill="#6B7A9B" font-weight="700">AGENT</text>
    <text x="52" y="190" font-size="16" fill="#0F172A" font-weight="700">DeepSeek</text>
    <text x="52" y="210" font-size="16" fill="#0F172A" font-weight="700">Harness</text>
    <g font-size="12.5" fill="#3A4A6B">
      <text x="52" y="238">site bilibili search</text>
      <text x="52" y="256">site zhihu hot</text>
      <text x="52" y="274" fill="#7C6CFF" font-weight="600">site weibo post …</text>
    </g>
  </g>
  <g transform="translate(148,150)">
    <circle r="16" fill="#0F172A"/>
    <text text-anchor="middle" dy="5" font-size="11" fill="#FFFFFF" font-family="Inter" font-weight="700">dsh</text>
  </g>
</g>

<!-- Card: Real Browser (center focus) -->
<g filter="url(#shadow)">
  <rect x="270" y="118" width="340" height="184" rx="16" fill="#FFFFFF" stroke="#FFFFFF"/>
  <!-- browser bar -->
  <rect x="270" y="118" width="340" height="36" rx="16" fill="url(#browserBar)"/>
  <rect x="270" y="138" width="340" height="16" fill="url(#browserBar)"/>
  <circle cx="294" cy="136" r="6" fill="#FF5F56"/>
  <circle cx="312" cy="136" r="6" fill="#FFBD2E"/>
  <circle cx="330" cy="136" r="6" fill="#27C93F"/>
  <rect x="352" y="128" width="190" height="16" rx="8" fill="#FFFFFF" stroke="#D6DBE8"/>
  <text x="362" y="140" font-size="9" fill="#7A869F" font-family="Inter">zhihu.com/hot — 已登录</text>
  <text x="552" y="140" font-size="10" fill="#7C6CFF">●</text>
  <!-- browser body -->
  <g font-family="Inter, -apple-system, sans-serif">
    <text x="294" y="178" font-size="11" letter-spacing="1.4" fill="#6B7A9B" font-weight="700">YOUR REAL BROWSER</text>
    <text x="294" y="204" font-size="13" fill="#0F172A" font-weight="600">Chrome / Edge 真实窗口</text>
    <text x="294" y="224" font-size="12" fill="#5B6B8A">登录态来自你自己的会话</text>
    <!-- chips -->
    <g font-size="11" font-weight="600">
      <rect x="294" y="236" width="74" height="24" rx="12" fill="#EEF0FF" stroke="#DDD8FF"/>
      <text x="306" y="252" fill="#5B4DFF">知乎 ✓</text>
      <rect x="376" y="236" width="68" height="24" rx="12" fill="#EEF0FF" stroke="#DDD8FF"/>
      <text x="388" y="252" fill="#5B4DFF">B站 ✓</text>
      <rect x="452" y="236" width="74" height="24" rx="12" fill="#EEF0FF" stroke="#DDD8FF"/>
      <text x="464" y="252" fill="#5B4DFF">微博 ✓</text>
      <rect x="534" y="236" width="58" height="24" rx="12" fill="#F1F4F9" stroke="#E2E8F5"/>
      <text x="544" y="252" fill="#6B7A9B">+167</text>
    </g>
  </g>
  <!-- approval badge -->
  <g transform="translate(444,272)">
    <rect x="-72" y="-12" width="144" height="24" rx="12" fill="#0F172A"/>
    <text text-anchor="middle" dy="5" font-size="10.5" fill="#FFFFFF" font-family="Inter" font-weight="600" letter-spacing="0.3">write → 需你确认</text>
  </g>
</g>

<!-- Card: Site Adapters -->
<g filter="url(#shadow)">
  <rect x="670" y="132" width="262" height="156" rx="16" fill="url(#cardBg)" stroke="#FFFFFF" stroke-opacity="0.9"/>
  <g font-family="Inter, -apple-system, sans-serif">
    <text x="694" y="164" font-size="11" letter-spacing="1.6" fill="#6B7A9B" font-weight="700">170+ ADAPTERS</text>
    <text x="694" y="188" font-size="15" fill="#0F172A" font-weight="700">结构化命令</text>
    <text x="694" y="208" font-size="12" fill="#5B6B8A">不是爬页面，是调接口</text>
    <g font-size="11.5" fill="#1E2A44">
      <text x="694" y="236">bilibili / zhihu / weibo</text>
      <text x="694" y="254">github / 12306 / xiaohongshu</text>
      <text x="694" y="272" fill="#7A869F">… 170+ sites</text>
    </g>
  </g>
  <g transform="translate(894,150)">
    <rect x="-22" y="-14" width="44" height="28" rx="8" fill="#7C6CFF"/>
    <text text-anchor="middle" dy="5" font-size="11" fill="#FFFFFF" font-family="Inter" font-weight="700">site</text>
  </g>
</g>

<!-- bottom caption -->
<text x="36" y="322" font-size="11" fill="#7F90B8" font-family="Inter, -apple-system, sans-serif">OpenCLI daemon + BrowserBridge 扩展 · 巡检面板可见哪些站在线 · 无头服务器不适用</text>
</svg>
